name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Public repository synchronization safeguards
        run: pnpm run test:public-sync

      - name: Read-only public publication plan
        id: public_plan
        continue-on-error: true
        run: pnpm run test:public-plan

      - name: Upload public publication plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-publication-plan-${{ github.sha }}
          path: .agent-tmp/publication-plan-ci
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce public publication plan
        if: steps.public_plan.outcome != 'success'
        run: exit 1

      - name: Typecheck
        run: pnpm run typecheck

      - name: Biome
        id: biome
        continue-on-error: true
        run: pnpm run check:biome

      - name: Prepare Biome diagnostics
        if: steps.biome.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp
          pnpm exec biome check . --write || true
          git diff --binary --full-index > .agent-tmp/biome-check.patch
          git status --short > .agent-tmp/biome-status.txt

      - name: Upload Biome diagnostics
        if: steps.biome.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: biome-diagnostics-${{ github.sha }}
          path: |
            .agent-tmp/biome-check.patch
            .agent-tmp/biome-status.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Biome
        if: steps.biome.outcome != 'success'
        run: exit 1

      - name: Build
        run: pnpm run build

      - name: CSS audit
        run: pnpm run audit:css

      - name: Bundle audit
        run: pnpm run audit:bundle
