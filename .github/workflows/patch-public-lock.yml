name: Patch public lockfile

on:
  push:
    branches:
      - release/testing-architecture-sync
    paths:
      - .github/workflows/patch-public-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/testing-architecture-sync
          fetch-depth: 0

      - name: Add Playwright Test lock entries
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          text = path.read_text()

          importer_anchor = "      '@cloudflare/vite-plugin':\n"
          importer_block = "      '@playwright/test':\n        specifier: ^1.61.1\n        version: 1.61.1\n"

          package_anchor = "  '@radix-ui/primitive@1.1.5':\n"
          package_block = "  '@playwright/test@1.61.1':\n    resolution: {integrity: sha512-8nKv6+0RJSL9FE4jYOEGXnPeM/Hg12qZpmqzZjRh3qM0Y7c3z1mrOTfFLids72RDQYVh9WpLEfR5WdpNX4fkig==}\n    engines: {node: '>=18'}\n    hasBin: true\n\n"

          snapshot_anchor = "  '@radix-ui/primitive@1.1.5': {}\n"
          snapshot_block = "  '@playwright/test@1.61.1':\n    dependencies:\n      playwright: 1.61.1\n\n"

          if importer_block not in text:
              text = text.replace(importer_anchor, importer_block + importer_anchor, 1)
          if package_block not in text:
              text = text.replace(package_anchor, package_block + package_anchor, 1)
          if snapshot_block not in text:
              text = text.replace(snapshot_anchor, snapshot_block + snapshot_anchor, 1)

          path.write_text(text)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update public Playwright lockfile"
          git push origin HEAD:release/testing-architecture-sync
